name: Transform
description: Transform (Transform Data) was a metrics-store and semantic-layer company
  backed by Redpoint Ventures that offered a metrics framework, a metrics catalog,
  and the MQL (Metrics Query Language) API, and open-sourced the MetricFlow metrics
  framework. Transform was acquired by dbt Labs (announced February 2023), and its
  technology lives on as MetricFlow and the dbt Semantic Layer. transform.co now
  returns a 308 Permanent Redirect to getdbt.com on every path, and the company no
  longer operates an independent API or developer surface — see the dbt provider
  profile in this network for the successor APIs.
